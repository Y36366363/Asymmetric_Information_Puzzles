<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10100f" />
    <title>AIP · 非对称博弈实验室</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="返回游戏大厅">
        <span class="brand-mark">AIP</span>
        <span>非对称博弈实验室</span>
      </button>
      <div class="status"><span class="status-dot"></span>仅在本机运行</div>
    </header>

    <main>
      <section id="lobbyView" class="view lobby-view">
        <div class="hero">
          <p class="eyebrow">ASYMMETRIC INFORMATION PUZZLES</p>
          <h1>把推理变成一场<br /><em>真正可以玩的博弈</em></h1>
          <p class="hero-copy">选择一个实验。你做决定，系统隐藏信息、扮演对手，并在关键时刻揭示概率与代价。</p>
        </div>
        <div class="game-grid" id="gameGrid" aria-live="polite"></div>
      </section>

      <section id="gameView" class="view game-view hidden">
        <div class="game-heading">
          <div>
            <button class="text-button" id="backButton">← 返回大厅</button>
            <p class="eyebrow">CASE 01 · 风险与谈判</p>
            <h1>命运之箱</h1>
          </div>
          <button class="secondary-button" id="newGameButton">重新开始</button>
        </div>

        <div class="game-layout">
          <aside class="prize-panel panel">
            <div class="panel-title"><span>奖金池</span><span id="remainingCount">26</span></div>
            <div class="prize-board" id="prizeBoard"></div>
          </aside>

          <section class="table-panel">
            <div class="round-banner">
              <div><span>回合</span><strong id="roundNumber">—</strong></div>
              <p id="instruction">请选择一个属于你的密封箱</p>
            </div>
            <div class="case-grid" id="caseGrid"></div>
            <div class="chosen-strip" id="chosenStrip">你的箱子尚未选择</div>
          </section>

          <aside class="insight-panel panel">
            <div class="panel-title"><span>决策仪表</span><span>LIVE</span></div>
            <div id="emptyInsight" class="empty-insight">银行家报价后，这里会显示期望值、风险和模型建议。</div>
            <div id="metrics" class="metrics hidden"></div>
            <div class="history">
              <h2>博弈记录</h2>
              <ol id="historyList"></ol>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <div class="modal-backdrop hidden" id="offerModal" role="dialog" aria-modal="true" aria-labelledby="offerTitle">
      <div class="offer-card">
        <p class="eyebrow">THE BANKER IS CALLING</p>
        <h2 id="offerTitle">银行家报价</h2>
        <div class="offer-value" id="offerValue">¥0</div>
        <p id="offerContext"></p>
        <div class="offer-actions">
          <button class="deal-button" id="dealButton">接受报价</button>
          <button class="no-deal-button" id="noDealButton">拒绝，继续开箱</button>
        </div>
      </div>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
