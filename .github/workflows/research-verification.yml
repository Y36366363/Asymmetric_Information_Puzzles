name: Research and runtime verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/verification.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification environment
        run: python -m pip install -r requirements/verification.txt
      - name: Verify research evidence and runtimes without provider credentials
        run: python scripts/verify.py
      - name: Check generated public assets match the checkout
        run: git diff --exit-code -- docs
